<!doctype html>
<html lang="en" data-view="dv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IP_UVM_DV_Gen &mdash; Spec In, VIP-based UVM Verification Out</title>
<style>
:root{
  --g-brand:linear-gradient(100deg,#1e1150 0%,#4a2e8f 46%,#7b3fd4 100%);
  --g-accent:linear-gradient(90deg,#00807e,#00c4b3);
  --g-alert:linear-gradient(90deg,#b3261e,#e0632a);
  --g-warn:linear-gradient(90deg,#b06a00,#d99a2b);
  --g-surf:linear-gradient(180deg,#fbfaff,#f2f0f8);
  --pp:#4a2e8f; --pp2:#7b3fd4; --tl:#00807e; --tl2:#00c4b3;
  --bg:#fff; --bg2:#f7f6fc; --bg3:#eeebf7; --fg:#191922; --fg2:#5c5c6e;
  --bd:#dedaeb; --code:#f4f2fa;
  --red:#b3261e; --redbg:#fdeeec; --amber:#a35f00; --amberbg:#fdf5e8;
  --green:#0f6b2f; --greenbg:#e9f6ec;
  --sh:0 1px 3px rgba(30,17,80,.09),0 6px 18px rgba(30,17,80,.05);
  --rail:214px; --insp:344px; --stat:36px;
  /* Legibility stack: large x-height, open apertures, real CJK fallbacks.
     No webfont URL -- the artifact CSP blocks font CDNs and a linked face
     would fall back silently to something nobody chose. */
  --ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",
       "Noto Sans","Microsoft JhengHei UI","PingFang TC","Noto Sans TC",Arial,sans-serif;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,"SF Mono",Menlo,"Noto Sans Mono",monospace;
}
:root[data-theme=dark]{
  --g-surf:linear-gradient(180deg,#1e1e28,#191921);
  --bg:#131319; --bg2:#1a1a22; --bg3:#24242f; --fg:#e9e9f1; --fg2:#a2a2b6;
  --bd:#31313f; --code:#1d1d27; --pp:#b9a3ff; --pp2:#8f6ee8;
  --tl:#4fd6d0; --tl2:#00c4b3;
  --redbg:#2c1c1b; --amberbg:#2a2318; --greenbg:#16281b;
  --red:#ff9a90; --amber:#e3a95e; --green:#8ddba0;
  --sh:0 1px 3px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.3);
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --g-surf:linear-gradient(180deg,#1e1e28,#191921);
  --bg:#131319; --bg2:#1a1a22; --bg3:#24242f; --fg:#e9e9f1; --fg2:#a2a2b6;
  --bd:#31313f; --code:#1d1d27; --pp:#b9a3ff; --pp2:#8f6ee8;
  --tl:#4fd6d0; --tl2:#00c4b3;
  --redbg:#2c1c1b; --amberbg:#2a2318; --greenbg:#16281b;
  --red:#ff9a90; --amber:#e3a95e; --green:#8ddba0;
  --sh:0 1px 3px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--fg);
 font:15.5px/1.65 var(--ui);
 -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
 text-rendering:optimizeLegibility}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
code,pre,kbd{font-family:var(--mono)}
h1,h2,h3,h4{line-height:1.25;margin:0}
button{font:inherit;cursor:pointer}

/* ---------- brand band ---------- */
.brand{height:58px;flex:0 0 58px;background:var(--g-brand);color:#fff;display:flex;align-items:center;
 gap:16px;padding:0 18px;position:relative;z-index:20}
.brand .sp{flex:1}
.bbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;
 border-radius:7px;padding:5px 11px;font-size:13.2px}
.bbtn:hover{background:rgba(255,255,255,.24)}
.bbtn.act{background:#fff;color:#3a1f78;border-color:#fff;font-weight:650}
.seg{display:flex;border:1px solid rgba(255,255,255,.22);border-radius:7px;overflow:hidden}
.seg .bbtn{border:0;border-radius:0}

/* ---------- pipeline rail ---------- */
.pipe{display:flex;align-items:stretch;flex:0 0 auto;background:var(--bg2);border-bottom:1px solid var(--bd);
 padding:0 10px;position:relative;z-index:15;overflow-x:auto}
.pnode{display:flex;align-items:center;gap:9px;padding:9px 14px;border:0;background:none;
 color:var(--fg2);white-space:nowrap;position:relative}
.pnode:hover{color:var(--fg)}
.pnode .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
 font-size:11.2px;font-weight:800;background:var(--bg3);color:var(--fg2);
 border:1.5px solid var(--bd);flex:0 0 auto}
.pnode .t{font-size:13.6px;font-weight:600}
.pnode .t small{display:block;font-size:10.8px;font-weight:600;letter-spacing:.7px;
 text-transform:uppercase;opacity:.7}
.pnode.on{color:var(--pp)}
.pnode.on .dot{background:var(--g-brand);color:#fff;border-color:transparent;
 box-shadow:0 0 0 3px rgba(123,63,212,.16)}
.pnode.ok .dot{background:var(--g-accent);color:#fff;border-color:transparent}
.pnode.ov .dot{background:var(--g-warn);color:#fff;border-color:transparent}
.pnode+.pnode::before{content:"";position:absolute;left:-2px;top:50%;width:6px;height:1.5px;
 background:var(--bd)}

/* ---------- shell ---------- */
.shell{display:flex;flex:1;min-height:0;position:relative;overflow:hidden}
.rail,.canvas,.insp{min-height:0}
.rail{width:var(--rail);flex:0 0 var(--rail);background:var(--bg2);border-right:1px solid var(--bd);
 overflow-y:auto;padding:10px 0}
.rail .lab{padding:11px 16px 5px;font-size:10.6px;letter-spacing:1.2px;text-transform:uppercase;
 color:var(--tl);font-weight:800}
.ritem{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;background:none;
 border:0;border-left:3px solid transparent;padding:8px 14px;color:var(--fg2);font-size:13.9px}
.ritem:hover{background:var(--bg3);color:var(--fg)}
.ritem.on{border-left-color:var(--pp);background:var(--bg3);color:var(--pp);font-weight:650}
.ritem .ic{width:17px;text-align:center;flex:0 0 auto;opacity:.85}
.ritem .mini{display:block;font-size:11.2px;font-weight:500;color:var(--fg2);margin-top:1px}
.ritem .bar{height:3px;border-radius:2px;background:var(--bd);margin-top:5px;overflow:hidden}
.ritem .bar i{display:block;height:100%;width:0;background:var(--g-accent);transition:width .25s}

.canvas{flex:1;min-width:0;overflow-y:auto;padding:20px 26px 60px}
.insp{width:var(--insp);flex:0 0 var(--insp);border-left:1px solid var(--bd);background:var(--bg2);
 overflow-y:auto;padding:16px 16px 50px}
.insp.collapsed{display:none}
@media(max-width:1180px){.insp{display:none}}
@media(max-width:820px){.rail{display:none}.canvas{padding:14px}}

/* ---------- canvas ---------- */
.wshead{margin-bottom:16px}
.wshead .kick{display:inline-block;font-size:10.8px;letter-spacing:1.3px;text-transform:uppercase;
 font-weight:800;color:#fff;padding:3px 10px;border-radius:20px;background:var(--g-brand)}
.wshead h2{font-size:24px;color:var(--pp);margin:8px 0 4px;font-weight:650;letter-spacing:-.3px}
.wshead p{margin:0;color:var(--fg2);font-size:14.6px;max-width:74ch}
.rule{height:3px;border-radius:3px;background:var(--g-accent);margin:12px 0 18px;max-width:120px}

.card{background:var(--g-surf);border:1px solid var(--bd);border-radius:12px;padding:15px 17px;
 margin:0 0 16px;box-shadow:var(--sh)}
.card>h3{font-size:15.6px;color:var(--tl);margin:0 0 9px;display:flex;align-items:center;gap:7px}
.card>h3 .q{margin-left:auto}
.card p{margin:0 0 9px}
.card p:last-child{margin-bottom:0}
.card ul{margin:0 0 9px;padding-left:19px}

.q{width:17px;height:17px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);
 color:var(--fg2);font-size:11.2px;font-weight:800;display:inline-grid;place-items:center;
 flex:0 0 auto;line-height:1}
.q:hover{border-color:var(--pp2);color:var(--pp)}

table.d{width:100%;border-collapse:collapse;font-size:13.7px;margin:6px 0 4px}
table.d th{background:var(--bg3);color:var(--pp);text-align:left;font-weight:650;padding:6px 9px;
 border:1px solid var(--bd);font-size:13px}
table.d td{padding:7px 10px;border:1px solid var(--bd);vertical-align:top}
pre{background:var(--code);border:1px solid var(--bd);border-left:3px solid var(--tl2);
 border-radius:0 8px 8px 0;padding:11px 14px;overflow-x:auto;font-size:12.9px;line-height:1.55;margin:8px 0}
p code,li code,td code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:13px}

.msg{border:1px solid;border-radius:10px;padding:10px 13px;margin:10px 0;font-size:14px}
.msg .lbl{display:block;font-size:10.8px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;
 margin-bottom:4px}
.msg.note{background:var(--bg2);border-color:var(--tl2)} .msg.note .lbl{color:var(--tl)}
.msg.warn{background:var(--amberbg);border-color:var(--amber)} .msg.warn .lbl{color:var(--amber)}
.msg.trap{background:var(--redbg);border-color:var(--red)} .msg.trap .lbl{color:var(--red)}
.msg.out{background:var(--greenbg);border-color:var(--green)} .msg.out .lbl{color:var(--green)}

ul.chk{list-style:none;padding:0;margin:4px 0}
ul.chk li{display:flex;gap:10px;align-items:flex-start;padding:6px 9px;border-radius:7px;font-size:14px}
ul.chk li:hover{background:var(--bg3)}
ul.chk input{margin-top:3px;width:15px;height:15px;accent-color:var(--tl);flex:0 0 auto;cursor:pointer}
ul.chk label{cursor:pointer}
ul.chk li.ticked label{color:var(--fg2);text-decoration:line-through}

/* forms */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px}
.fld label{display:block;font-size:10.9px;letter-spacing:.8px;text-transform:uppercase;color:var(--fg2);
 font-weight:800;margin-bottom:4px}
.fld select,.fld input{width:100%;padding:8px 10px;font:inherit;font-size:14px;border:1px solid var(--bd);
 border-radius:7px;background:var(--bg);color:var(--fg)}
.fld select:focus,.fld input:focus{outline:2px solid var(--pp2);outline-offset:-1px}
.fld .why{font-size:12.3px;color:var(--fg2);margin-top:5px;line-height:1.5}

.gatebar{display:flex;align-items:center;gap:12px;border:1px dashed var(--pp2);border-radius:11px;
 padding:11px 14px;margin-top:18px;background:var(--bg2)}
.gatebar .txt{flex:1;font-size:13.9px}
.gatebar .txt b{color:var(--pp)}
.btn{border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:8px;padding:7px 14px;font-size:13.9px}
.btn:hover{border-color:var(--pp2);color:var(--pp)}
.btn.pri{background:var(--g-brand);border-color:transparent;color:#fff}
.btn.pri:hover{color:#fff;filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.drop{border:2px dashed var(--bd);border-radius:11px;padding:20px;text-align:center;color:var(--fg2);
 font-size:13.9px;background:var(--bg2)}
.drop.hot{border-color:var(--tl2);background:var(--greenbg);color:var(--fg)}

/* inspector */
.insp h4{font-size:10.9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tl);
 font-weight:800;margin:0 0 8px}
.insp .ibody{font-size:13.9px}
.insp .ibody h5{font-size:14.4px;margin:14px 0 5px;color:var(--pp)}
.insp .ibody p{margin:0 0 9px}
.insp .empty{color:var(--fg2);font-size:13.4px;font-style:italic}

/* status bar */
.stat{flex:0 0 var(--stat);height:var(--stat);background:var(--g-brand);color:#fff;
 display:flex;align-items:center;gap:0;font-size:12.7px;z-index:30}
.stat .s{padding:0 13px;height:100%;display:flex;align-items:center;gap:7px;border:0;background:none;
 color:#fff;border-right:1px solid rgba(255,255,255,.16);white-space:nowrap}
.stat .s:hover{background:rgba(255,255,255,.13)}
.stat .s b{font-weight:700}
.stat .sp{flex:1}
.stat .pill{border-radius:20px;padding:1px 9px;font-weight:700;font-size:11.3px;letter-spacing:.4px}
.pill.ok{background:#0f6b2f;color:#d6f5de}
.pill.no{background:#8f1f18;color:#ffd9d5}
.pill.ov{background:#8a5200;color:#ffe6bd}
.dotm{width:8px;height:8px;border-radius:50%;background:var(--tl2);box-shadow:0 0 0 3px rgba(0,196,179,.28)}

/* overlays */
.pop{position:fixed;z-index:60;max-width:330px;background:var(--bg);border:1px solid var(--bd);
 border-radius:11px;box-shadow:var(--sh);padding:12px 14px;font-size:13.6px;display:none}
.pop.on{display:block}
.pop b{color:var(--pp)}
.scrim{position:fixed;inset:0;background:rgba(20,12,50,.5);z-index:70;display:none;
 align-items:center;justify-content:center;padding:20px}
.scrim.on{display:flex}
.modal{background:var(--bg);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);
 width:min(620px,100%);max-height:84vh;overflow:auto}
.modal .mh{background:var(--g-brand);color:#fff;padding:13px 18px;font-weight:650;font-size:16px}
.modal .mb{padding:16px 18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--bd);display:flex;gap:9px;justify-content:flex-end}
.modal input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;
 background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
textarea{width:100%;min-height:300px;font-family:var(--mono);font-size:12.9px;padding:12px;
 border:1px solid var(--bd);border-radius:10px;background:var(--code);color:var(--fg);line-height:1.5}
.toast{position:fixed;bottom:calc(var(--stat) + 14px);left:50%;transform:translateX(-50%) translateY(14px);
 background:var(--g-brand);color:#fff;padding:9px 18px;border-radius:22px;font-size:13.9px;z-index:80;
 opacity:0;transition:.22s;pointer-events:none;box-shadow:var(--sh)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.pal{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);z-index:75;
 background:var(--bg);border:1px solid var(--bd);border-radius:13px;box-shadow:var(--sh);display:none;overflow:hidden}
.pal.on{display:block}
.pal input{width:100%;border:0;border-bottom:1px solid var(--bd);padding:14px 16px;font:inherit;
 font-size:16px;background:none;color:var(--fg);outline:none}
.pal .res{max-height:44vh;overflow:auto}
.pal .r{padding:9px 16px;font-size:14px;cursor:pointer;display:flex;gap:9px}
.pal .r:hover,.pal .r.sel{background:var(--bg3)}
.pal .r .k{color:var(--fg2);font-size:12.2px;margin-left:auto}
.coach{position:fixed;z-index:90;background:var(--bg);border:2px solid var(--pp2);border-radius:12px;
 padding:14px 16px;max-width:330px;box-shadow:var(--sh);display:none;font-size:13.9px}
.coach.on{display:block}
.coach .cf{display:flex;gap:8px;justify-content:flex-end;margin-top:11px}
.stat,.stat b,table.d td,.ritem .mini,.pnode .dot{font-variant-numeric:tabular-nums}
button:focus-visible,.q:focus-visible{outline:2px solid var(--tl2);outline-offset:2px;border-radius:6px}
.brand button:focus-visible,.stat .s:focus-visible{outline-color:#fff;outline-offset:-3px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
  html{scroll-behavior:auto}
}
.hide{display:none!important}
.rtlonly{display:none}
html[data-view=rtl] .dvonly{display:none}
html[data-view=rtl] .rtlonly{display:revert}
.forrtl{border-left:3px solid var(--tl2)}
</style>
</head>
<body>

<!-- ================= BRAND ================= -->
<div class="app">
<div class="brand">
  <div class="sp"></div>
  <div class="seg">
    <button class="bbtn act" id="vdv" onclick="setView('dv')">DV view</button>
    <button class="bbtn" id="vrtl" onclick="setView('rtl')">RTL view</button>
  </div>
  <button class="bbtn" onclick="palOpen()">&#8984;K</button>
  <button class="bbtn" onclick="tour(0)">Tour</button>
  <button class="bbtn" id="thb" onclick="theme()">Dark</button>
</div>

<!-- ================= PIPELINE ================= -->
<div class="pipe" id="pipe"></div>

<!-- ================= SHELL ================= -->
<div class="shell">
  <div class="rail" id="rail"></div>
  <div class="canvas" id="canvas"></div>
  <aside class="insp" id="insp">
    <h4>Inspector</h4>
    <div class="ibody" id="ibody"><p class="empty">Hover or focus anything with a
      <span class="q">?</span> to see why it matters, the trap attached to it, and what the agent
      says about it.</p></div>
  </aside>
</div>

<!-- ================= STATUS ================= -->
<div class="stat">
  <button class="s" onclick="go(0)"><span class="dotm"></span><b id="st_ip">--</b></button>
  <button class="s" onclick="go(0)">role <b id="st_role">--</b></button>
  <button class="s" onclick="go(0)">attach <b id="st_att">--</b></button>
  <button class="s" onclick="go(0)">paths <b id="st_paths">--</b></button>
  <button class="s" onclick="go(1)">facts <b id="st_facts">0/7</b></button>
  <button class="s" onclick="gateDlg()">gate <span class="pill no" id="st_gate">--</span></button>
  <div class="sp"></div>
  <button class="s" onclick="go(5)">progress <b id="st_pct">0%</b></button>
</div>

</div><!-- /app -->

<!-- overlays -->
<div class="pop" id="pop"></div>
<div class="toast" id="toast"></div>
<div class="pal" id="pal"><input id="palq" placeholder="Jump to a workspace, field or trap..."
  oninput="palFilter()" onkeydown="palKey(event)"><div class="res" id="palres"></div></div>
<div class="scrim" id="scrim" onclick="if(event.target===this)closeModal()">
  <div class="modal"><div class="mh" id="mh"></div><div class="mb" id="mb"></div>
  <div class="mf" id="mf"></div></div>
</div>
<div class="coach" id="coach"></div>

<script>
/* ==================== PROTOCOL PROFILES ==================== */
const P={
 USB:{pf:"usb_",roles:["device","host","dual-role"],ser:"tx/rx differential pairs, dp/dm",
   dig:"PIPE3 / PIPE4, UTMI+, ULPI",reg:"APB",rec:"digital",
   pole:"Enumeration, then link training; descriptor management per transfer"},
 PCIe:{pf:"pcie_",roles:["endpoint","root complex","dual-mode"],ser:"SerDes lanes",
   dig:"PIPE -- the practical choice above Gen3",reg:"config space + APB/AXI",rec:"digital",
   pole:"Link training (LTSSM) dominates. TLP / DLLP / PHY means three observation levels, not one"},
 Ethernet:{pf:"eth_",roles:["MAC","PHY"],ser:"SerDes / MDI",
   dig:"xMII: GMII, RGMII, XGMII, USXGMII",reg:"APB or AXI-Lite",rec:"digital",
   pole:"Descriptor rings; pause/flow control and timestamping are separate feature axes"},
 MIPI_CSI:{pf:"csi_",roles:["receiver","transmitter"],ser:"D-PHY / C-PHY lanes",dig:"PPI",
   reg:"APB",rec:"digital",
   pole:"Frame and line structure -- the natural check is image-level, not packet-level. Virtual channels multiply the stream count"},
 MIPI_DSI:{pf:"dsi_",roles:["transmitter/host","receiver/peripheral"],ser:"D-PHY / C-PHY lanes",
   dig:"PPI",reg:"APB",rec:"digital",
   pole:"Command mode and video mode are effectively two separate plans; bus-turnaround timing is the hard item"},
 CAN_FD:{pf:"canfd_",roles:["node"],ser:"the CANH/CANL pin pair -- always; the bit rate makes it cheap",
   dig:"n/a",reg:"APB",rec:"serial",
   pole:"Arbitration and error / fault confinement, not payload movement. Bit-rate switching is the FD-specific axis"},
 eDP:{pf:"edp_",roles:["source (TX)","sink (RX)"],ser:"main-link lanes + AUX channel",
   dig:"link-layer interface where the IP exposes one",reg:"APB",rec:"serial",
   pole:"Link training over AUX, then video timing and stream attributes"},
 eMMC:{pf:"emmc_",roles:["host controller","device"],ser:"CMD/DAT/CLK bus pins",dig:"n/a",
   reg:"APB/AXI + descriptor DMA",rec:"serial",
   pole:"Device initialisation and bus-width negotiation, then high-speed mode tuning"},
 SDIO:{pf:"sdio_",roles:["host controller","card"],ser:"CMD/DAT/CLK bus pins",dig:"n/a",
   reg:"APB/AXI + descriptor DMA",rec:"serial",
   pole:"Card init and function abstraction; interrupt handling is the subtle part"},
 AMBA4:{pf:"axi_",roles:["master","slave","both"],ser:"the bus is the interface",dig:"n/a",
   reg:"n/a",rec:"bus",
   pole:"Ordering, outstanding behaviour, exclusive access, boundary rules"}
};

/* ==================== HINTS (inspector + popovers) ==================== */
const H={
 ip:{t:"Target IP",b:"Selects the profile: attachment layer, register bus, and where the schedule actually goes. If your IP is not listed, fill the same six columns from the databook in <code>Doc/</code> before starting."},
 prefix:{t:"IP prefix",b:"Prefixes every file and class you create. Consistency here is what makes the tree navigable a year later. It also drives the file manifest in the Package workspace."},
 role:{t:"DUT role",b:"<b>The VIP takes the opposite role.</b> Confirm it from the RTL parameter header, never from a document or from the module name. Getting this wrong invalidates the whole environment."},
 attach:{t:"Attachment layer",b:"A <b>compile-time build configuration</b>, not a runtime switch. Serial means the chip pads; digital means the controller-to-PHY interface inside the IP, which needs hierarchical force plus disabling the PHY instance."},
 proj:{t:"Project root",b:"Holds <code>DUT/ Doc/ Spec/ VIP/</code> as given. You create <code>uvm/</code> and <code>sim/</code> beside them."},
 ninst:{t:"Instances",b:"More than one changes hierarchical paths, per-instance descriptor addresses, and the bring-up order -- sequential before concurrent, always."},
 sib:{t:"The sibling requirement",b:"<code>vcs.opt</code> uses relative paths that only resolve when <code>vlogan</code> runs from <code>DUT_ROOT_PATH</code>. The five directories and <code>vcs.opt</code> must be siblings. One missing directory produces an elaboration failure whose message does not name the cause."},
 hook:{t:"Why only two files change",b:"Everything else attaches with <code>bind</code>. Only three things cannot: the bridge instances (patterns reach them by hierarchical path), the register-macro redirect (preprocessing is sequential, so it must precede the model's task definitions), and the pattern <code>initial</code> block."},
 addr:{t:"Three-source agreement",b:"Find the address <b>comparator</b>, not the slave. A common idiom is one address nibble per slave with the address broadcast to all of them -- so a document listing two instances at the same address is not necessarily a typo. Corroborate with a per-base access histogram over the existing BFM patterns."},
 ts:{t:"Timescale arithmetic",b:"required clock = line_rate x oversample (Synopsys VIP commonly needs 4x); half period = 1/(2 x clock). If the half period is not an integer multiple of the timescale precision the clock is <b>silently distorted</b>. Put this check in the Makefile."},
 pad:{t:"Does the PHY drive the pads?",b:"A PHY deliverable is often only the digital encoder or PCS. Verify by experiment, not by reading. If the pads never move, the serial layer is unavailable -- and if an unrelated decision has already closed off the digital layer, you have no fallback."},
 obj:{t:"The silent pass",b:"A <code>run_phase</code> with no objection does not wait. It ends at time 0 and reports a pass. A pattern in a Verilog <code>initial</code> cannot raise one, so it sets a module-scope <code>pattern_done</code> bit that the base test waits on."},
 conc:{t:"Same sequencer, different locks",b:"If the register bridge and the bus VIP's random traffic share a sequencer but hold separate locks, they really do overlap and UVM interleaves them. Random-address writes then land in the IP's register space <b>with no error message at all</b>."},
 rnd:{t:"Randomization",b:"<code>uvm_do</code> randomizes every unpinned <code>rand</code> field. <code>uvm_create</code>+<code>uvm_send</code> randomizes nothing, so every declared default stands -- and a wrong default is wrong every time."},
 equiv:{t:"Prove equivalence",b:"Resolve every address macro to a literal and compare register writes one-for-one against the original, then classify <b>every</b> difference. A clean result reads: N writes identical, differences fall into four explainable groups."},
 sb:{t:"Scoreboards that get switched off",b:"Never compare beat-by-beat when the DUT may legally split, reorder or relocate. Check invariants: totals, boundary rules, response presence and status. A scoreboard that false-alarms gets disabled, and then it checks nothing."},
 arity:{t:"The highest-value static check",b:"Call argument count against the declaration. This error lives at the call site, each of which looks right alone. It has caught a task declared with zero arguments and called with one from every pattern in the pool."},
 toc:{t:"The table of contents moves",b:"Adding a section changes the contents page height, which shifts every page after it. Measure the rendered PDF, rewrite the TOC, and re-measure until the numbers stop moving."},
 gate:{t:"Soft gates",b:"Advancing with an unmet gate is allowed, but it asks for a typed reason. The reason is recorded, shown in the status bar, and included in the exported report. Discipline stays visible without trapping anyone."}
};

{id:"architect",kick:"Decide",name:"Design",icon:"◧",
 goal:"Where the VIP meets the DUT, and how Verilog patterns reach UVM without either side knowing about the other.",

  "If the half period is not an integer multiple of the timescale precision, the clock is <b>silently distorted</b>. Put the check in the Makefile and <code>$(error)</code> on a mismatch. Beyond representability there is event count: a very fast clock across a full SoC netlist can make meaningful traffic volumes unaffordable.")}

  <tr><td style="color:var(--fg2);font-weight:600">Contains</td><td>modules, nets, static tasks, events</td><td>UVM components, objects, sequences</td></tr>

  <p style="margin-top:9px">The UVM tree does not exist in the database <code>-kdb</code> captures. So the only
   thing that can cross is a module-scope variable plus an event &mdash; <b>static storage with a dynamic value</b>.</p>
  <pre>${bridge(c)}</pre>`)}

 ${card("The two hooks "+qq("hook"),`<pre>${hooks(c)}</pre>

 ${checks("Architect checklist",[

{id:"generate",kick:"Write the code",name:"Build",icon:"▦",
 goal:"Named tasks a designer can call, and the existing BFM patterns carried over with their value intact and their errors found.",
 gate:["c7a","c7d","c7e","c7f"],
 build:c=>`
 <div class="dvonly">${card("Wrapping the VIP: the rules that decide correctness "+qq("rnd"),`
  <table class="d"><tr><th style="width:26%">Idiom</th><th style="width:15%">Randomizes?</th><th>Consequence</th></tr>
  <tr><td><code>uvm_do</code></td><td><b>yes</b>, every unpinned <code>rand</code> field</td><td>Byte enables, protection attributes and lengths become random</td></tr>
  <tr><td><code>uvm_create</code>+<code>uvm_send</code></td><td><b>no</b></td><td>Every declared default stands. <b>A wrong default is wrong every time</b></td></tr></table>
  <ul style="margin-top:9px">
   <li><b>VIP constraints are usually conditional on &quot;that feature is disabled&quot;.</b> Enabling a feature means owning all of its fields.</li>
   <li><b>Read the declaration; never guess arity from the name.</b></li>
   <li><b>Response handshakes are mandatory</b> where defined &mdash; read data is often only valid after one.</li>
   <li><b>Do not over-constrain the protocol path</b>; derived fields make randomize fail.</li>
   <li>Configuration arrays are indexed <b>by position</b>, not by the protocol's numbering.</li>
   <li>Width defines have narrow defaults and truncate silently.</li>
   <li>Copy misspelled class names verbatim. Directions often have different length ceilings.</li>
  </ul>`)}</div>

 ${card("Converting the BFM patterns "+qq("equiv"),`
  <pre>Keep verbatim : every access that programs THE DUT
Delete        : everything that programs the far side the VIP replaces
Add           : a handful of VIP task calls in its place</pre>
  <p>The far side is typically a second instance of the same IP inside the testbench &mdash; and often its
   macro definition or its instance <b>is not even in the delivery</b>, meaning the originals cannot run as
   delivered either.</p>
  <p><b>Then prove equivalence.</b> Resolve every address macro to a literal, compare register writes
   one-for-one, and classify <b>every</b> difference.</p>`)}

 ${card("Audit against the databook initialisation table",`
  <table class="d"><tr><th style="width:42%">Expect to find</th><th>Why it survives</th></tr>
  <tr><td><b>A required step missing everywhere</b></td><td>One such audit found it absent from 22 of 23 patterns</td></tr>
  <tr><td>Steps in the wrong order</td><td>Nothing checks the order</td></tr>
  <tr><td><b>Enable masks that do not cover what was configured</b></td><td>Compute the mask from the commands the file actually issues &mdash; never copy it</td></tr>
  <tr><td>A per-transfer resource armed once per pattern</td><td>Descriptors are consumed by the transfer that uses them</td></tr>
  <tr><td>Reset confusion</td><td>The IP's soft reset and the SoC wrapper's reset are different registers</td></tr>
  <tr><td>Absolute paths into someone's home directory</td><td>A failed memory load usually only <b>warns</b>: buffer is zeros, transfer silently does nothing</td></tr>
  </table>
  ${msg("warn","The common symptom","None of these fail compilation. <b>The symptom is always a far-side timeout</b>, which is why they survive so long.")}`)}

 ${card("File manifest",`<pre>${manifest(c)}</pre>`)}

 ${checks("Generate checklist",[
  ["c7a","Every wrapper's arity read from the declaration, not guessed"],
  ["c7b","Width defines set explicitly"],
  ["c7c","Fields pinned where <code>uvm_do</code> would randomize them"],
  ["c7d","Every BFM pattern converted"],
  ["c7e","<b>Equivalence proven</b> write-by-write, every difference classified"],
  ["c7f","Procedure audited against the databook initialisation table"],
  ["c7g","Enable masks recomputed from the commands each file issues"],
  ["c7h","No absolute paths outside the environment remain"]])}

 ${msg("out","Produces","Wrapped VIP task files, two pattern suites (converted-BFM and VIP-derived), and <code>bfm-pattern-analysis.md</code> with the equivalence result and audit findings.")}`},

{id:"verify",kick:"Prove it",name:"Check",icon:"◫",
 goal:"Checking that fires on real defects and never on legal behaviour, and a bring-up order that makes every failure attributable.",
 gate:["c8b","c8e","c10a","c12a"],
 build:c=>`
 ${msg("note","Count what you already have first",
  "A Synopsys protocol VIP ships <b>dozens of built-in protocol, link and physical checkers</b> that run automatically. Moving from BFM scripts &mdash; which usually check nothing &mdash; to the VIP is by itself the largest single increase in checking the project gets. Then connect them to coverage: the per-check switches default <b>on for failures, off for passes</b>, and turning the pass side on is what answers &quot;was this ever exercised&quot;.")}

 <div class="dvonly">${card("Scoreboard rules "+qq("sb"),`
  <table class="d"><tr><th style="width:34%">Rule</th><th>Failure it prevents</th></tr>
  <tr><td><b>Check the right response field</b></td><td>A scalar initialised to OK and meaningful only for writes silently passes <b>every read error</b></td></tr>
  <tr><td><b>Footprint is not payload</b></td><td>A partial final beat makes the footprint larger than the data; otherwise every non-multiple length reports a mismatch</td></tr>
  <tr><td><b>Prefer invariants to reconstruction</b></td><td><b>A scoreboard that false-alarms gets switched off, and then it checks nothing</b></td></tr>
  <tr><td><b>Know when your observation fires</b></td><td>A protocol callback fires when the layer <i>sees</i> the transfer, not when data movement completes</td></tr>
  <tr><td><b>Separate stimulus from DUT traffic</b></td><td>An error on one means the testbench is wrong; on the other, the design is</td></tr>
  <tr><td><code>$realtime</code> is scope-relative</td><td>Mixed timescales are silently out by orders of magnitude. Write <code>$realtime / real'(1s)</code></td></tr></table>`)}</div>

 <div class="dvonly">${card("Static self-check &mdash; eleven categories, in value order "+qq("arity"),`
  <table class="d"><tr><th style="width:6%">#</th><th>Check</th></tr>
  <tr><td>1</td><td><b>Call argument count against the declaration</b> &mdash; <i>the highest-value check by a wide margin</i></td></tr>

 ${card("Bring-up order",`<pre>${bringup(c)}</pre>

 ${msg("out","Produces","Configuration-consistency checker, DMA scoreboard, performance monitor, <code>checker-and-monitor-plan.md</code>, and a repeatable static check with a record of what it found.")}`},

/* ==================== STATE ==================== */
const K="ipuvm.v2.", $=s=>document.querySelector(s);
let cur=0, overrides={};
function C(){return{
  ip:g("ip","PCIe"),prefix:g("prefix",""),role:g("role",""),attach:g("attach",""),
  proj:g("proj","/proj/<chip>"),n:Math.max(1,parseInt(g("ninst","1"),10)||1)};}
function g(k,d){const v=localStorage.getItem(K+k);return (v===null||v==="")?d:v;}
function set(k,v){localStorage.setItem(K+k,v);}
function chk(id){return localStorage.getItem(K+"c."+id)==="1";}

/* ==================== HELPERS ==================== */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function qq(k){return `<button class="q" data-h="${k}" onmouseenter="popShow(this)" onmouseleave="popHide()" onclick="inspShow('${k}')">?</button>`;}
function card(t,b,h){return `<div class="card"><h3>${t}${h?'<span class="q" data-h="'+h+'" onmouseenter="popShow(this)" onmouseleave="popHide()" onclick="inspShow(\''+h+'\')">?</span>':''}</h3>${b}</div>`;}
function msg(k,t,b){return `<div class="msg ${k}"><span class="lbl">${t}</span>${b}</div>`;}
function checks(t,rows){return card(t,`<ul class="chk">${rows.map(r=>
  `<li${chk(r[0])?' class="ticked"':''}><input type="checkbox" id="${r[0]}"${chk(r[0])?" checked":""}
   onchange="tick(this)"><label for="${r[0]}">${r[1]}</label></li>`).join("")}</ul>`);}
function factRow(n,f,w,c){const id="f"+n;return `<tr><td><input type="checkbox" id="${id}"${chk(id)?" checked":""}
  onchange="tick(this)" style="accent-color:var(--tl)"> ${n}</td><td><b>${f}</b></td><td>${w}</td><td>${c}</td></tr>`;}
function fld(id,lab,kind){
  const c=C(),p=P[c.ip];
  let inp;
  if(kind==="select"&&id==="ip") inp=`<select id="f_ip" onchange="chgIp()">${Object.keys(P).map(k=>`<option${k===c.ip?" selected":""}>${k}</option>`).join("")}</select>`;
  else if(kind==="select"&&id==="role") inp=`<select id="f_role" onchange="chg('role',this.value)">${p.roles.map(r=>`<option${r===c.role?" selected":""}>${r}</option>`).join("")}</select>`;
  else if(kind==="select"&&id==="attach"){const o=["serial","digital"];inp=`<select id="f_attach" onchange="chg('attach',this.value)">${o.map(r=>`<option value="${r}"${r===c.attach?" selected":""}>${r} &mdash; ${r==="serial"?"the chip pads":"controller-to-PHY"}</option>`).join("")}</select>`;}
  else if(kind==="number") inp=`<input id="f_ninst" type="number" min="1" max="8" value="${c.n}" oninput="chg('ninst',this.value)">`;
  else inp=`<input id="f_${id}" value="${esc(c[id]||"")}" spellcheck="false" oninput="chg('${id}',this.value)">`;
  return `<div class="fld"><label>${lab} ${qq(id)}</label>${inp}<div class="why">${H[id]?H[id].b.replace(/<b>|<\/b>/g,""):""}</div></div>`;
}
function recTxt(c){const p=P[c.ip];
  if(p.rec==="bus") return "<b>Not applicable</b> &mdash; the bus is the interface";
  return "<b>"+p.rec+"</b>"+(p.rec!==c.attach?" <span style='color:var(--amber)'>(you selected "+c.attach+" &mdash; confirm that is deliberate)</span>":"");}
function tree(c){return esc(
`${c.proj}/
|-- DUT/          design + the existing simulation environment   READ-ONLY*
|   |-- ENV/          library / technology environment
|   |-- MACRO/        SRAM, ROM, PLL and other hard macros
|   |-- MODEL/        the BFM model layer          <- HOOK 1
|   |-- RTLCAT/       RTL, chip top, decoder, parameter header
|   |-- command.txt   the existing test script
|   \`-- vcs.opt       the DUT filelist             <- HOOK 2
|-- Doc/          databook, programming guide, register map
|-- Spec/         ${c.ip.replace(/_/g," ")} standard and interface specifications
|-- VIP/          Synopsys VIP:  examples/ include/ lib/ src/   READ-ONLY
|-- uvm/          YOU CREATE:  tb/ filelist/ hex/ docs/ vplan/
\`-- sim/          YOU CREATE:  scripts/ is input; the rest is a product

* the two HOOK blocks are the only exceptions`);}
function bridge(c){return esc(
`module ${c.prefix}seq_launcher;
  string req_seq_name;    // exists at elaboration, has a hierarchical path
  string req_target;      // which sequencer
  int    req_arg0, req_arg1;
  bit    req_background;  // 1 = launch and return
  bit    req_ok;          // filled in by UVM
  event  req_posted;      // Verilog -> UVM
  event  req_done;        // UVM -> Verilog
  bit    ready = 1'b0;
  semaphore lock = new(1);
endmodule

// TWO bridges, not one -- different lifetimes, different failure modes:
//   ${c.prefix}reg_arb        register access  (CPUWRITE / CPUREAD)
//   ${c.prefix}seq_launcher   sequence launch  (RUN_SEQ / FORK_SEQ)
// Keep an owner/name field in each: it makes the boundary readable in the
// FSDB, which is how you tell "Verilog never posted" from "UVM never answered".`);}
function hooks(c){return esc(
`// HOOK 1 -- DUT/MODEL/<model>.v : replaces the one include line
//==== DV_UVM HOOK -- begin ====
\`ifdef DV_UVM
  \`include "dv_uvm_hook.svh"   // bridges + macro redirect + pattern initial
\`else
  \`include "command.txt"       // original behaviour, byte for byte
\`endif
//==== DV_UVM HOOK -- end ====

// HOOK 2 -- DUT/vcs.opt : one appended line
// A VCS filelist has no \`ifdef and needs none: dv_uvm_files.f carries only
// search paths, defines, and one source file whose body is \`ifdef DV_UVM.
-f $UVM_ROOT_PATH/filelist/dv_uvm_files.f`);}
function manifest(c){const i=c.prefix,IP=i.replace(/_$/,"").toUpperCase();return esc(
`uvm/tb/top/     dv_uvm_all.sv        one compile entry; body \`ifdef DV_UVM
                dv_uvm_hook.svh      included INTO the TB top
                ${i}uvm_bind.sv / ${i}uvm_bind_inst.sv
                ${i}reg_arb.sv / ${i}seq_launcher.sv
                ${i}dev_init.svh     the databook init table, as macros
                ${i}stages.svh       named bring-up stages
                ${i}mem_util.svh     descriptor / buffer fill, dump, compare
                ${i}desc_defs.svh    per-instance descriptor addresses
                *_vip_tasks.svh      wrapped VIP sequences, one per protocol
uvm/tb/env/     ${i}top_env.sv  ${i}top_cfg.sv  ${i}reg_defs.svh
                ${i}hier_defs.svh  ${i}probe_if.sv  ${i}cfg_check.sv
                ${i}dma_mon.sv  ${i}dma_scoreboard.sv  ${i}perf_monitor.sv
                ${i}payload_publish_cb.sv  ${i}event_bridge.sv
                ${i}virtual_sequencer.sv
uvm/tb/seq/     sequences, dispatchers, virtual sequences
uvm/tb/agents/  clock/reset, sideband, register checker
uvm/tb/tests/   ONE uvm_test -- variation comes from patterns
uvm/tb/patterns/  dv_uvm_pattern_pool.svh (+PATTERN dispatcher)
                  basic .txt, sanity/ (converted BFM), ${i.replace(/_$/,"")}/ (VIP derived)
uvm/filelist/   dv_uvm_files.f  SOLE owner of the source list
                ${i}build.f       +incdir+ / +define+ only
uvm/hex/        stimulus and descriptor images
uvm/docs/       README.md  dut-request.md  ${i}port-analysis.md
                bfm-pattern-analysis.md  command-txt-uvm-migration.md
                model-task-uvm-usability.md  uvm-reuse-map.md
                ${i}example-pattern-pool.md  checker-and-monitor-plan.md
                ${IP}_Verification_User_Guide.pdf + .html
uvm/vplan/      ${IP}_Verification_Plan.xlsx
sim/scripts/    Makefile  waves.tcl
<root>/         CLAUDE.md  README_PACKAGE.md  agents/  reference/`);}
function bringup(c){const m=c.n>1;return esc(
`1  smoke          known-good addresses only, no protocol   <- proves the chain
2  connection     single instance, slowest mode, link only
3  transfer       one each direction
`+(m?`4  multi          all ${c.n} instances, SEQUENTIALLY
5  concurrent     all ${c.n} in flight together
`:`4  (single instance -- steps 4 and 5 do not apply)
`)+`6  mixed bus      register + DMA + protocol traffic at once
7  performance    per instance, then aggregate`);}

/* ==================== RENDER ==================== */
function build(){
  const c=C();
  $("#pipe").innerHTML=WS.map((w,i)=>{
    const st=gateState(i);
    return `<button class="pnode ${i===cur?"on":""} ${st==="pass"?"ok":st==="over"?"ov":""}"
      onclick="go(${i})"><span class="dot">${st==="pass"?"✓":st==="over"?"!":i+1}</span>
      <span class="t"><small>${w.kick}</small>${w.name}</span></button>`;}).join("");
  $("#rail").innerHTML=`<div class="lab">Steps</div>`+WS.map((w,i)=>{
    const p=wsPct(i);
    return `<button class="ritem ${i===cur?"on":""}" onclick="go(${i})">
      <span class="ic">${w.icon}</span><span style="flex:1">${w.name}
      <span class="mini">${w.kick}</span><span class="bar"><i style="width:${p}%"></i></span></span></button>`;
  }).join("")+`<div class="lab">Reference</div>
    <button class="ritem" onclick="inspShow('gate')"><span class="ic">⚠</span><span>Gate rules</span></button>
    <button class="ritem" onclick="go(5);setTimeout(mkBrief,0)"><span class="ic">⤓</span><span>Kickoff brief</span></button>`;
  const w=WS[cur];
  $("#canvas").innerHTML=`
    <div class="wshead"><span class="kick">${w.kick}</span>
      <h2>${w.name}</h2><p>${w.goal}</p></div><div class="rule"></div>
    ${w.build(c)}
    ${gateBar()}`;
  status();
}
function wsPct(i){const w=WS[i];let a=0,t=0;
  (allIds(i)).forEach(id=>{t++;if(chk(id))a++;});
  return t?Math.round(100*a/t):0;}
function allIds(i){
  const out=[];const w=WS[i];
  if(w.id==="discover") for(let k=1;k<=7;k++) out.push("f"+k);
  const m=String(w.build).match(/\["c\d+[a-z]","/g)||[];
  // collect from the checklist definitions by re-running a light scan
  const s=String(w.build);
  const re=/\["(c\d+[a-z])"/g;let x;
  while((x=re.exec(s))) out.push(x[1]);
  return [...new Set(out)];
}
function gateState(i){
  const w=WS[i];
  if(overrides[w.id]) return "over";
  return w.gate.every(id=>chk(id))?"pass":"open";
}
function gateBar(){
  const w=WS[cur],st=gateState(cur);
  const miss=w.gate.filter(id=>!chk(id));
  const txt = st==="pass" ? "<b>Gate passed.</b> Everything this workspace owes the next one is done."
    : st==="over" ? "<b>Gate overridden.</b> Reason: "+esc(overrides[w.id])
    : "<b>Gate open.</b> "+miss.length+" required item"+(miss.length===1?"":"s")+" outstanding.";
  const nxt = cur<WS.length-1;
  return `<div class="gatebar"><div class="txt">${txt} ${qq("gate")}</div>
   ${cur>0?'<button class="btn" onclick="go('+(cur-1)+')">Back</button>':""}
   ${nxt?`<button class="btn pri" onclick="advance()">Continue to ${WS[cur+1].name} &rarr;</button>`:
        `<button class="btn pri" onclick="mkBrief()">Generate kickoff brief</button>`}</div>`;
}
function advance(){
  const st=gateState(cur);
  if(st==="open"){gateDlg();return;}
  go(cur+1);
}
function go(i){cur=Math.max(0,Math.min(WS.length-1,i));set("cur",cur);build();
  document.querySelector(".canvas").scrollTop=0;}
function tick(cb){set("c."+cb.id,cb.checked?"1":"0");
  const li=cb.closest("li"); if(li) li.classList.toggle("ticked",cb.checked);
  status(); refreshRails();}
function refreshRails(){
  $("#pipe").querySelectorAll(".pnode").forEach((n,i)=>{
    const st=gateState(i);n.classList.toggle("ok",st==="pass");n.classList.toggle("ov",st==="over");
    const d=n.querySelector(".dot");d.textContent=st==="pass"?"✓":st==="over"?"!":i+1;});
  $("#rail").querySelectorAll(".ritem .bar i").forEach((b,i)=>{if(i<WS.length)b.style.width=wsPct(i)+"%";});
  const gb=document.querySelector(".gatebar"); if(gb) gb.outerHTML=gateBar();
}
function status(){
  const c=C();
  $("#st_ip").textContent=c.ip.replace(/_/g," ");
  $("#st_role").textContent=c.role||"--";
  $("#st_att").textContent=P[c.ip].rec==="bus"?"n/a":c.attach;
  const okp = c.proj && c.proj.indexOf("<")<0;
  $("#st_paths").textContent = okp?"✓":"set root";
  let f=0;for(let i=1;i<=7;i++) if(chk("f"+i)) f++;
  $("#st_facts").textContent=f+"/7";
  const st=gateState(cur),el=$("#st_gate");
  el.textContent = st==="pass"?"PASS":st==="over"?"OVERRIDDEN":"OPEN";
  el.className="pill "+(st==="pass"?"ok":st==="over"?"ov":"no");
  let a=0,t=0;WS.forEach((w,i)=>{allIds(i).forEach(id=>{t++;if(chk(id))a++;});});
  $("#st_pct").textContent=(t?Math.round(100*a/t):0)+"%";
}

/* ==================== CONFIG EDITS ==================== */
function chgIp(){
  const v=$("#f_ip").value; set("ip",v);
  set("prefix",P[v].pf); set("role",P[v].roles[0]);
  set("attach",P[v].rec==="bus"?"serial":P[v].rec);
  build(); toast("Profile loaded: "+v.replace(/_/g," "));
}
function chg(k,v){
  set(k==="ninst"?"ninst":k,v);
  if(k==="attach"){const c=C(),p=P[c.ip];
    if(p.rec!=="bus"&&p.rec!==v)
      toast("Profile recommends '"+p.rec+"' for "+c.ip.replace(/_/g," ")+" -- confirm this is deliberate");}
  status();
  if(k==="attach"||k==="ninst"||k==="prefix") build();
}

/* ==================== POPOVER / INSPECTOR ==================== */
function popShow(el){
  const k=el.dataset.h,h=H[k];if(!h)return;
  const p=$("#pop");p.innerHTML=`<b>${h.t}</b><br>${h.b}`;p.classList.add("on");
  const r=el.getBoundingClientRect();
  p.style.left=Math.min(window.innerWidth-350,r.left)+"px";
  p.style.top=(r.bottom+8)+"px";
  if(r.bottom+p.offsetHeight+20>window.innerHeight) p.style.top=(r.top-p.offsetHeight-8)+"px";
}
function popHide(){$("#pop").classList.remove("on");}
function inspShow(k){
  const h=H[k];if(!h)return;
  $("#ibody").innerHTML=`<h5>${h.t}</h5><p>${h.b}</p>
   <p style="color:var(--fg2);font-size:12px;border-top:1px solid var(--bd);padding-top:9px">
   Full text: <code>~/.claude/agents/IP_UVM_DV_Gen.md</code></p>`;
  popHide();
}

/* ==================== GATE MODAL ==================== */
function gateDlg(){
  const w=WS[cur],miss=w.gate.filter(id=>!chk(id));
  const st=gateState(cur);
  $("#mh").textContent = st==="pass" ? "Gate passed — "+w.name : "Gate open — "+w.name;
  if(st==="pass"){
    $("#mb").innerHTML=`<p>Every required item for <b>${w.name}</b> is complete.</p>`;
    $("#mf").innerHTML=`<button class="btn pri" onclick="closeModal()">Close</button>`;
  }else{
    $("#mb").innerHTML=`<p>These required items are outstanding:</p>
     <ul>${miss.map(id=>`<li><code>${id}</code> &mdash; ${labelOf(id)}</li>`).join("")}</ul>
     ${msg("note","Soft gate","You may continue anyway. The reason is recorded, shown in the status bar, and included in the exported checklist report.")}
     <label style="display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--fg2);font-weight:800;margin:12px 0 5px">Reason for overriding</label>
     <input type="text" id="ovr" placeholder="e.g. address map blocked on the SoC team, proceeding with placeholders">`;
    $("#mf").innerHTML=`<button class="btn" onclick="closeModal()">Go back</button>
      <button class="btn pri" onclick="doOverride()">Override and continue</button>`;
  }
  $("#scrim").classList.add("on");
  setTimeout(()=>{const i=$("#ovr");if(i)i.focus();},60);
}
function labelOf(id){
  const el=document.querySelector(`label[for="${id}"]`);
  return el?el.textContent.trim():"(see the checklist in this workspace)";
}
function doOverride(){
  const r=($("#ovr").value||"").trim();
  if(!r){toast("A reason is required to override.");return;}
  overrides[WS[cur].id]=r; set("ovr."+WS[cur].id,r);
  closeModal(); toast("Override recorded."); go(cur+1);
}
function closeModal(){$("#scrim").classList.remove("on");}

/* ==================== FILE INSPECT ==================== */
function readFile(f){
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{parseFile(f.name,r.result);};
  r.readAsText(f);
}
function parseFile(name,txt){
  const lines=txt.split(/\r?\n/);
  const defs=[...new Set((txt.match(/\+define\+\s*([A-Za-z_]\w*)/g)||[]).map(s=>s.replace(/\+define\+\s*/,"")))];
  const ifd=[...new Set((txt.match(/`ifn?def\s+([A-Za-z_]\w*)/g)||[]).map(s=>s.split(/\s+/)[1]))];
  const par=[];const pr=/parameter\s+(?:\[[^\]]*\]\s*)?([A-Za-z_]\w*)\s*=\s*([^;,\/]+)/g;let m;
  while((m=pr.exec(txt))&&par.length<40) par.push([m[1],m[2].trim()]);
  const hx={};
  (txt.match(/\d*'h\s*[0-9a-fA-F_]{6,}/g)||[]).forEach(h=>{
    const v=h.replace(/.*'h\s*/,"").replace(/_/g,"").toLowerCase();
    if(v.length>=6){const b=v.slice(0,4);hx[b]=(hx[b]||0)+1;}});
  const top=Object.entries(hx).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const ev=k=>{const i=lines.findIndex(l=>l.indexOf(k)>=0);return i<0?"":`${name}:${i+1}`;};
  $("#dropout").innerHTML=`
   ${msg("note","Parsed in this browser — nothing was uploaded",
     `<b>${esc(name)}</b>, ${lines.length} lines. Everything below is <b>a hint, not a fact</b>.
      Confirm each against the RTL and record the citation yourself.`)}
   ${defs.length?card("Defines set here <span style='font-size:11px;color:var(--fg2)'>they decide which ifdef branches are live</span>",
     `<p>${defs.map(d=>`<code>${esc(d)}</code>`).join(" ")}</p>
      <p style="font-size:12px;color:var(--fg2)">First occurrence: <code>${esc(ev("+define+"))}</code></p>`):""}
   ${ifd.length?card("Conditional branches referenced",
     `<p>${ifd.slice(0,40).map(d=>`<code>${esc(d)}</code>`).join(" ")}</p>`):""}
   ${par.length?card("Parameters",
     `<table class="d"><tr><th style="width:45%">Name</th><th>Value</th></tr>
      ${par.map(p=>`<tr><td><code>${esc(p[0])}</code></td><td><code>${esc(p[1])}</code></td></tr>`).join("")}</table>
      ${msg("warn","Fact 1 and fact 2 live here","Read the role and the enabled features from this table — and then cite the line, because half the VIP test list is filtered by it.")}`):""}
   ${top.length?card("Candidate address bases <span style='font-size:11px;color:var(--fg2)'>histogram of hex literals</span>",
     `<table class="d"><tr><th style="width:40%">Prefix</th><th>Occurrences</th></tr>
      ${top.map(t=>`<tr><td><code>0x${esc(t[0])}_....</code></td><td>${t[1]}</td></tr>`).join("")}</table>
      ${msg("trap","This is source 2 of 3, at best","A histogram names the blocks; it does not prove a base address. <b>Find the decoder's address comparator</b> and corroborate with the register map before committing anything.")}`):""}
   ${(!defs.length&&!par.length&&!top.length)?msg("warn","Nothing recognised","No <code>+define+</code>, <code>parameter</code> or long hex literals found. This parser only looks for those — read the file directly."):""}`;
  toast("Parsed "+name+" locally.");
}
(function dnd(){
  document.addEventListener("dragover",e=>{const d=$("#drop");if(!d)return;e.preventDefault();d.classList.add("hot");});
  document.addEventListener("dragleave",e=>{const d=$("#drop");if(d)d.classList.remove("hot");});
  document.addEventListener("drop",e=>{const d=$("#drop");if(!d)return;e.preventDefault();
    d.classList.remove("hot");if(e.dataTransfer.files[0])readFile(e.dataTransfer.files[0]);});
})();

/* ==================== EXPORT ==================== */
function mkBrief(){
  const c=C(),p=P[c.ip],IP=c.prefix.replace(/_$/,"").toUpperCase();
  const mis=(p.rec!=="bus"&&p.rec!==c.attach)?
   `\n  NOTE: the profile recommends '${p.rec}' for this IP; '${c.attach}' was chosen.\n        Confirm that is deliberate before writing any wiring.\n`:"";
  const ov=Object.keys(overrides).map(k=>`  ${k}: ${overrides[k]}`).join("\n");
  const t=`Use the IP_UVM_DV_Gen agent.

Build a Synopsys VIP-based IP-level UVM verification environment for the target
below, inserted into the existing SoC testbench without breaking the
command.txt flow.

TARGET SETTINGS
  TARGET_IP      : ${c.ip}
  IP_PREFIX      : ${c.prefix}
  DUT_ROLE       : ${c.role}          (the VIP takes the opposite role)
  ATTACH_LAYER   : ${c.attach}
  INSTANCES      : ${c.n}
  PROJECT ROOT   : ${c.proj}${mis}
PATHS
  DUT_ROOT_PATH  = ${c.proj}/DUT      (ENV MACRO MODEL RTLCAT command.txt vcs.opt as siblings)
  VIP_HOME       = ${c.proj}/VIP      (protocol + register-bus + DMA-bus VIP)
  UVM_ROOT_PATH  = ${c.proj}/uvm      (to be created)
  SIM_ROOT_PATH  = ${c.proj}/sim      (to be created)

TOOLCHAIN
  Simulation : Synopsys VCS
  Debug      : Synopsys Verdi (FSDB only)
  VIP        : Synopsys VC VIP (SVT)

PROFILE (confirm each against the RTL)
  Serial layer       : ${p.ser}
  Digital layer      : ${p.dig}
  Register bus       : ${p.reg}
  Expected long pole : ${p.pole}

PROGRESS SO FAR
${WS.map((w,i)=>`  ${w.name.padEnd(10)} ${String(wsPct(i)).padStart(3)}%   gate: ${gateState(i)}`).join("\n")}
${ov?"\nGATE OVERRIDES\n"+ov+"\n":""}
WHAT I WANT FIRST
  Setup and Analyze only: confirm the input tree, then establish the seven
  facts with file:line citations. Do not write testbench code yet.

  Deliver:
    - a facts document with citations
    - dut-request.md, open items ordered by what they block
    - three-source agreement on every register base address
    - an explicit answer on whether the PHY drives the pads in simulation,
      since that decides the attachment layer and has no fallback

CONSTRAINTS
  1. The existing flow must still work. Every DUT edit is a guarded hook block,
     inert without +define+DV_UVM, and greppable as "DV_UVM HOOK".
  2. Pattern authors need no UVM knowledge -- plain SystemVerilog, named tasks.
  3. One elaboration serves every pattern. Selection is a run-time plusarg.
  4. Cite file:line for every RTL or VIP fact.
  5. Never report "compiles" when you mean "passes static checking".`;
  const ta=$("#ta"); if(ta){ta.value=t;} return t;
}
function copyTA(){const ta=$("#ta");if(!ta)return;if(!ta.value)mkBrief();
  ta.select();try{document.execCommand("copy");toast("Copied to clipboard.");}catch(e){}}
function blobDl(name,txt){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"}));
  a.download=name;a.click();URL.revokeObjectURL(a.href);toast("Downloaded "+name);}
function dl(n){blobDl(n,mkBrief());}
function dlJson(){const c=C();
  blobDl("ip_uvm_dv_gen.settings.json",JSON.stringify({...c,overrides},null,2));}
function dlReport(){
  const c=C();let out=`IP_UVM_DV_Gen checklist report\nTarget: ${c.ip}  role ${c.role}  attach ${c.attach}  instances ${c.n}\nRoot: ${c.proj}\n`;
  WS.forEach((w,i)=>{
    out+=`\n== ${w.name} (${w.kick})  ${wsPct(i)}%  gate: ${gateState(i)}\n`;
    if(overrides[w.id]) out+=`   OVERRIDE: ${overrides[w.id]}\n`;
    allIds(i).forEach(id=>{
      const l=labelOf(id).replace(/\s+/g," ");
      out+=`   [${chk(id)?"x":" "}] ${id}  ${l}\n`;});
  });
  blobDl("ip_uvm_dv_gen.report.txt",out);
}

/* ==================== MISC UI ==================== */
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("on"),2600);}
function theme(){
  const cu=document.documentElement.getAttribute("data-theme")||
    (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  const nx=cu==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",nx);set("theme",nx);
  $("#thb").textContent=nx==="dark"?"Light":"Dark";}
function setView(v,silent){
  document.documentElement.setAttribute("data-view",v);set("view",v);
  $("#vdv").classList.toggle("act",v==="dv");$("#vrtl").classList.toggle("act",v==="rtl");
  if(silent)return;                       // boot must not toast
  if(v==="rtl"){toast("RTL view: the two file edits, and the facts we need confirmed.");go(0);}
  else toast("DV view: every step, including the build mechanics.");
  build();}

/* command palette */
const PAL=[];WS.forEach((w,i)=>PAL.push({t:w.name+"  ("+w.kick+")",k:"workspace",go:()=>go(i)}));
Object.keys(H).forEach(k=>PAL.push({t:H[k].t,k:"hint",go:()=>inspShow(k)}));
PAL.push({t:"Generate kickoff brief",k:"action",go:()=>{go(5);setTimeout(mkBrief,80);}});
PAL.push({t:"Download checklist report",k:"action",go:dlReport});
PAL.push({t:"Toggle theme",k:"action",go:theme});
let palI=0,palL=[];
function palOpen(){$("#pal").classList.add("on");$("#palq").value="";palFilter();$("#palq").focus();}
function palClose(){$("#pal").classList.remove("on");}
function palFilter(){
  const q=$("#palq").value.toLowerCase();
  palL=PAL.filter(p=>p.t.toLowerCase().includes(q));palI=0;
  $("#palres").innerHTML=palL.map((p,i)=>
    `<div class="r ${i===0?"sel":""}" onclick="palGo(${i})">${esc(p.t)}<span class="k">${p.k}</span></div>`).join("");
}
function palGo(i){const p=palL[i];if(p){palClose();p.go();}}
function palKey(e){
  if(e.key==="Escape")return palClose();
  if(e.key==="Enter")return palGo(palI);
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();palI=Math.max(0,Math.min(palL.length-1,palI+(e.key==="ArrowDown"?1:-1)));
    $("#palres").querySelectorAll(".r").forEach((r,i)=>r.classList.toggle("sel",i===palI));
  }
}
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();palOpen();}
  if(e.key==="Escape"){palClose();closeModal();popHide();$("#coach").classList.remove("on");}
});

/* coach tour */
const TOUR=[
 ["#pipe","below-centre","The workflow","Six steps, left to right. <b>Spec in</b> at Setup, <b>UVM out</b> at Package &mdash; each one consumes what the previous produced."],
 ["#rail","right","Where you are","The rail shows completion per workspace. Nothing here is decoration &mdash; the bars come from the checklists you tick."],
 ["#canvas","centre","The work","Forms, rules and traps for this stage. Anything with a <span class='q'>?</span> explains itself &mdash; hover for a summary, click to pin it in the inspector."],
 ["#insp","left","The inspector","Long-form rationale, and where the full text lives in the agent file."],
 [".stat","above-right","The status bar","Target, path validity, facts established, gate state and overall progress. Every segment jumps to the workspace that owns it."]
];
function tour(i){
  const c=$("#coach");
  if(i>=TOUR.length){c.classList.remove("on");set("tour","1");return;}
  const [sel,place,t,b]=TOUR[i];const el=document.querySelector(sel);
  if(!el)return tour(i+1);
  c.innerHTML=`<b style="color:var(--pp)">${t}</b><p style="margin:6px 0 0">${b}</p>
   <div class="cf"><button class="btn" onclick="tour(${TOUR.length})">Skip</button>
   <button class="btn pri" onclick="tour(${i+1})">${i===TOUR.length-1?"Done":"Next"}</button></div>`;
  c.classList.add("on");
  // measure after content is in, then place so the card never covers its own target
  const r=el.getBoundingClientRect(), w=c.offsetWidth, h=c.offsetHeight, m=14;
  let top, left;
  switch(place){
    case "right":        left=r.right+m;               top=r.top+40; break;
    case "left":         left=r.left-w-m;              top=r.top+40; break;
    case "centre":       left=r.left+(r.width-w)/2;    top=r.top+70; break;
    case "above-right":  left=r.right-w-m;             top=r.top-h-m; break;
    default: /* below-centre */
                         left=r.left+(r.width-w)/2;    top=r.bottom+m;
  }
  c.style.left=Math.round(Math.max(m,Math.min(window.innerWidth-w-m,left)))+"px";
  c.style.top =Math.round(Math.max(m,Math.min(window.innerHeight-h-m,top)))+"px";
}

  document.addEventListener("DOMContentLoaded",()=>{
    if(th) $("#thb").textContent=th==="dark"?"Light":"Dark";

  });
